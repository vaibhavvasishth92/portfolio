<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third-Party Risk Assessment — Vaibhav Vasishth</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;padding:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useMemo, useState } = React;
const { CartesianGrid, Cell, ReferenceLine, ResponsiveContainer, Scatter, ScatterChart, Tooltip, XAxis, YAxis, ZAxis } = Recharts;

// ---- Palette (inline styles; artifact runtime ships only core Tailwind classes) ----
const c = {
  bg: "#EEF0F5",
  panel: "#FFFFFF",
  ink: "#151A2B",
  sub: "#5B657C",
  line: "#DBDFEA",
  accent: "#3A3F8F",
  accentSoft: "#E7E8F5",
  low: "#127A56", lowBg: "#E4F3EC",
  mod: "#B9760A", modBg: "#FBEEDA",
  high: "#C4581C", highBg: "#FBEADD",
  crit: "#B5302E", critBg: "#F8E5E4",
};
const num = { fontVariantNumeric: "tabular-nums" };

const DOMAINS = [
  { key: "financial", label: "Financial viability" },
  { key: "operational", label: "Operational / service" },
  { key: "compliance", label: "Compliance & regulatory" },
  { key: "cyber", label: "Information security" },
  { key: "concentration", label: "Concentration / substitutability" },
];

// ---- Demo register (generic vendors — safe for a public portfolio) ----
const seed = [
  { id: 1, name: "Northwind Freight Systems", type: "Carrier", criticality: 78, financial: 25, operational: 30, compliance: 20, cyber: 35, concentration: 40 },
  { id: 2, name: "Cascade Payments Ltd.", type: "Payments Processor", criticality: 92, financial: 40, operational: 45, compliance: 70, cyber: 78, concentration: 65 },
  { id: 3, name: "Meridian Data Services", type: "Cloud / Data", criticality: 85, financial: 55, operational: 50, compliance: 60, cyber: 82, concentration: 88 },
  { id: 4, name: "Atlas Telematics", type: "Tech Vendor", criticality: 45, financial: 30, operational: 35, compliance: 30, cyber: 40, concentration: 30 },
  { id: 5, name: "Brightway KYC Screening", type: "Compliance / RegTech", criticality: 88, financial: 35, operational: 40, compliance: 85, cyber: 55, concentration: 70 },
  { id: 6, name: "Summit Fleet Services", type: "Carrier", criticality: 50, financial: 62, operational: 68, compliance: 35, cyber: 30, concentration: 45 },
];

// ---- Risk engine: inherent domain risk + criticality -> exposure, tier, rationale, action ----
function assess(v) {
  const domainAvg = Math.round(
    DOMAINS.reduce((a, d) => a + v[d.key], 0) / DOMAINS.length
  );
  const exposure = Math.round(0.6 * domainAvg + 0.4 * v.criticality);
  let tier =
    exposure >= 72 ? "Critical" : exposure >= 55 ? "High" : exposure >= 38 ? "Moderate" : "Low";

  // Highest-risk domains drive the narrative
  const ranked = [...DOMAINS].sort((a, b) => v[b.key] - v[a.key]);
  const top = ranked.filter((d) => v[d.key] >= 55).slice(0, 2);
  const rationale =
    top.length === 0
      ? 'Inherent risk is contained across all domains (avg ' + domainAvg + '/100).'
      : 'Driven by ' + top.map(function(d) { return d.label.toLowerCase() + ' (' + v[d.key] + ')'; }).join(' and ') +
          (v.criticality >= 75 ? ', amplified by high business criticality (' + v.criticality + ')' : '') +
        '.';

  let action;
  if (tier === "Critical") action = "Enhanced due diligence, executive risk sign-off, and continuous monitoring.";
  else if (tier === "High") action = "Full due diligence, documented remediation plan, and annual review.";
  else if (tier === "Moderate") action = "Standard due diligence with periodic (bi-annual) review.";
  else action = "Baseline checks; reassess at contract renewal.";

  return { domainAvg, exposure, tier, rationale, action };
}

const tierColor = (t) =>
  t === "Low" ? c.low : t === "Moderate" ? c.mod : t === "High" ? c.high : c.crit;
const tierBg = (t) =>
  t === "Low" ? c.lowBg : t === "Moderate" ? c.modBg : t === "High" ? c.highBg : c.critBg;

// ---- Notes parser: turn pasted due-diligence text into structured domain flags ----
function parseNotes(text) {
  const t = text.toLowerCase();
  const adj = { financial: 20, operational: 20, compliance: 20, cyber: 20, concentration: 20, criticality: 50 };
  const flags = [];
  const bump = (k, v, msg) => { adj[k] = Math.max(adj[k], v); flags.push(msg); };

  // Information security
  if (/(soc ?2|iso ?27001).*(expired|missing|no |lack)|no (soc|encryption|mfa|iso)|unencrypted/.test(t)) bump("cyber", 80, "Security certification gap");
  if (/breach|incident|vulnerabilit|ransomware|no mfa|weak password/.test(t)) bump("cyber", 78, "Security incident / control weakness");
  // Compliance
  if (/non-?compliant|audit finding|no dpa|no gdpr|regulatory|sanction|kyc|aml|expired cert/.test(t)) bump("compliance", 78, "Compliance / regulatory concern");
  // Financial
  if (/bankrupt|insolven|declining revenue|late payment|financially unstable|going concern|distress/.test(t)) bump("financial", 80, "Financial instability");
  if (/financially stable|strong balance|profitable|well[- ]funded/.test(t)) { adj.financial = Math.min(adj.financial, 20); flags.push("Financially stable (mitigant)"); }
  // Operational
  if (/no bcp|no dr |no disaster|outage|downtime|sla breach|service failure|missed sla/.test(t)) bump("operational", 75, "Operational resilience gap");
  // Concentration
  if (/single[- ]source|sole supplier|no alternative|hard to replace|only provider|lock[- ]in/.test(t)) { bump("concentration", 85, "Concentration / substitutability risk"); adj.criticality = Math.max(adj.criticality, 80); }
  if (/critical|essential|core system|customer[- ]facing|revenue[- ]critical/.test(t)) adj.criticality = Math.max(adj.criticality, 80);

  return { adj, flags };
}

function Chip({ tier }) {
  return (
    <span className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold"
      style={{ color: tierColor(tier), background: tierBg(tier) }}>
      <span className="h-1.5 w-1.5 rounded-full" style={{ background: tierColor(tier) }} />
      {tier}
    </span>
  );
}

function Kpi({ label, value, sub }) {
  return (
    <div className="rounded-2xl p-5" style={{ background: c.panel, border: '1px solid ' + c.line }}>
      <div className="text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>{label}</div>
      <div className="mt-2 text-3xl font-bold" style={{ color: c.ink, ...num, fontFamily: "'Space Grotesk', sans-serif" }}>{value}</div>
      {sub && <div className="mt-1 text-xs" style={{ color: c.sub }}>{sub}</div>}
    </div>
  );
}

function ThirdPartyRiskAssessment() {
  const [vendors, setVendors] = useState(seed);
  const [expanded, setExpanded] = useState(null);
  const [notes, setNotes] = useState("");
  const [parsedFlags, setParsedFlags] = useState([]);
  const [form, setForm] = useState({
    name: "", type: "Tech Vendor", criticality: 50,
    financial: 20, operational: 20, compliance: 20, cyber: 20, concentration: 20,
  });

  const assessed = useMemo(() => vendors.map((v) => ({ ...v, ...assess(v) })), [vendors]);
  const sorted = useMemo(() => [...assessed].sort((a, b) => b.exposure - a.exposure), [assessed]);

  const totals = useMemo(() => {
    const counts = { Low: 0, Moderate: 0, High: 0, Critical: 0 };
    assessed.forEach((v) => (counts[v.tier] += 1));
    const avg = Math.round(assessed.reduce((a, v) => a + v.exposure, 0) / (assessed.length || 1));
    return { counts, avg };
  }, [assessed]);

  const analyze = () => {
    if (!notes.trim()) return;
    const { adj, flags } = parseNotes(notes);
    setForm((f) => ({ ...f, ...adj }));
    setParsedFlags(flags);
  };

  const addVendor = () => {
    if (!form.name.trim()) return;
    setVendors((prev) => [...prev, { ...form, id: Date.now() }]);
    setForm({ ...form, name: "" });
    setNotes(""); setParsedFlags([]);
  };

  const scatterData = assessed.map((v) => ({ x: v.domainAvg, y: v.criticality, z: 130, name: v.name, tier: v.tier }));

  const slider = (label, key) => (
    <label className="block">
      <div className="flex items-center justify-between text-xs font-medium" style={{ color: c.sub }}>
        <span>{label}</span><span style={{ color: c.ink, ...num }}>{form[key]}</span>
      </div>
      <input type="range" min={0} max={100} step={1} value={form[key]}
        onChange={(e) => setForm({ ...form, [key]: Number(e.target.value) })}
        className="mt-1.5 w-full" style={{ accentColor: c.accent }} />
    </label>
  );

  return (
    <div style={{ background: c.bg, color: c.ink, fontFamily: "'Inter', system-ui, sans-serif" }} className="min-h-screen w-full">
      <div className="mx-auto max-w-6xl px-5 py-8">
        {/* Header */}
        <div className="flex flex-wrap items-end justify-between gap-4">
          <div>
            <div className="flex items-center gap-2 text-xs font-semibold uppercase tracking-widest" style={{ color: c.accent }}>
              <span className="h-2 w-2 rounded-full" style={{ background: c.accent }} />
              Third-Party Risk Management
            </div>
            <h1 className="mt-2 text-3xl font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
              Third-Party Risk Assessment
            </h1>
            <p className="mt-1 text-sm" style={{ color: c.sub }}>
              Inherent risk across financial, operational, compliance, security, and concentration domains — tiered by exposure and criticality.
            </p>
          </div>
          <div className="flex flex-wrap items-center gap-3 text-xs" style={{ color: c.sub }}>
            {["Low", "Moderate", "High", "Critical"].map((t) => (
              <span key={t} className="inline-flex items-center gap-1.5">
                <span className="h-2.5 w-2.5 rounded-full" style={{ background: tierColor(t) }} />{t}
              </span>
            ))}
          </div>
        </div>

        {/* KPIs */}
        <div className="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-2 md:grid-cols-4">
          <Kpi label="Vendors assessed" value={assessed.length} sub="in the register" />
          <Kpi label="Critical tier" value={totals.counts.Critical} sub="enhanced due diligence" />
          <Kpi label="High tier" value={totals.counts.High} sub="remediation required" />
          <Kpi label="Avg. exposure" value={totals.avg} sub="0–100 composite" />
        </div>

        {/* Tier distribution */}
        <div className="mt-3 rounded-2xl p-5" style={{ background: c.panel, border: '1px solid ' + c.line }}>
          <div className="mb-2 text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>Risk tier distribution</div>
          <div className="flex h-3 w-full overflow-hidden rounded-full" style={{ background: c.bg }}>
            {["Low", "Moderate", "High", "Critical"].map((t) => {
              const w = (totals.counts[t] / assessed.length) * 100;
              return <div key={t} style={{ width: w + '%', background: tierColor(t) }} title={t + ': ' + totals.counts[t]} />;
            })}
          </div>
          <div className="mt-2 flex justify-between text-xs" style={{ color: c.sub }}>
            {["Low", "Moderate", "High", "Critical"].map((t) => <span key={t}>{totals.counts[t]} {t.toLowerCase()}</span>)}
          </div>
        </div>

        {/* Matrix + intake */}
        <div className="mt-3 grid grid-cols-1 gap-3 lg:grid-cols-5">
          <div className="rounded-2xl p-5 lg:col-span-3" style={{ background: c.panel, border: '1px solid ' + c.line }}>
            <div className="mb-1 text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>Risk matrix</div>
            <div className="mb-3 text-xs" style={{ color: c.sub }}>Inherent risk vs. business criticality — the top-right quadrant demands the most oversight.</div>
            <div style={{ height: 300 }}>
              <ResponsiveContainer width="100%" height="100%">
                <ScatterChart margin={{ top: 10, right: 20, bottom: 20, left: 0 }}>
                  <CartesianGrid stroke={c.line} strokeDasharray="3 3" />
                  <XAxis type="number" dataKey="x" domain={[0, 100]} name="Inherent risk" tick={{ fontSize: 11, fill: c.sub }} label={{ value: "Inherent risk", position: "insideBottom", offset: -8, fontSize: 11, fill: c.sub }} />
                  <YAxis type="number" dataKey="y" domain={[0, 100]} name="Criticality" tick={{ fontSize: 11, fill: c.sub }} label={{ value: "Business criticality", angle: -90, position: "insideLeft", fontSize: 11, fill: c.sub }} />
                  <ZAxis type="number" dataKey="z" range={[90, 240]} />
                  <ReferenceLine x={55} stroke={c.line} /><ReferenceLine y={65} stroke={c.line} />
                  <Tooltip cursor={{ strokeDasharray: "3 3" }}
                    content={({ payload }) => {
                      if (!payload || !payload.length) return null;
                      const d = payload[0].payload;
                      return (
                        <div className="rounded-lg px-3 py-2 text-xs shadow" style={{ background: c.panel, border: '1px solid ' + c.line }}>
                          <div className="font-semibold" style={{ color: c.ink }}>{d.name}</div>
                          <div style={{ color: c.sub }}>risk {d.x} · criticality {d.y}</div>
                          <div style={{ color: tierColor(d.tier) }}>{d.tier}</div>
                        </div>
                      );
                    }} />
                  <Scatter data={scatterData}>
                    {scatterData.map((d, i) => <Cell key={i} fill={tierColor(d.tier)} fillOpacity={0.85} />)}
                  </Scatter>
                </ScatterChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* Intake with notes parser */}
          <div className="rounded-2xl p-5 lg:col-span-2" style={{ background: c.panel, border: '1px solid ' + c.line }}>
            <div className="mb-3 text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>Assess a vendor</div>
            <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Vendor name"
              className="mb-2 w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ border: '1px solid ' + c.line, color: c.ink }} />
            <input value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} placeholder="Vendor type (e.g. Payments Processor)"
              className="mb-3 w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ border: '1px solid ' + c.line, color: c.ink }} />

            <div className="rounded-lg p-3" style={{ background: c.bg }}>
              <div className="text-xs font-medium" style={{ color: c.ink }}>Paste due-diligence notes (optional)</div>
              <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={3}
                placeholder="e.g. SOC 2 expired, single-source provider, financially stable, one SLA breach last quarter"
                className="mt-1.5 w-full rounded-md px-2.5 py-2 text-xs outline-none" style={{ border: '1px solid ' + c.line, color: c.ink, resize: "vertical" }} />
              <button onClick={analyze} className="mt-2 w-full rounded-md py-2 text-xs font-semibold" style={{ background: c.accentSoft, color: c.accent }}>
                Analyze notes → set risk domains
              </button>
              {parsedFlags.length > 0 && (
                <div className="mt-2 flex flex-wrap gap-1.5">
                  {parsedFlags.map((f, i) => (
                    <span key={i} className="rounded-full px-2 py-0.5 text-[11px]" style={{ background: c.panel, border: '1px solid ' + c.line, color: c.sub }}>{f}</span>
                  ))}
                </div>
              )}
            </div>

            <div className="mt-3 space-y-2.5">
              {slider("Business criticality", "criticality")}
              {DOMAINS.map((d) => <div key={d.key}>{slider(d.label, d.key)}</div>)}
            </div>
            <button onClick={addVendor} className="mt-4 w-full rounded-lg py-2.5 text-sm font-semibold text-white transition-opacity hover:opacity-90" style={{ background: c.accent }}>
              Add to register
            </button>
          </div>
        </div>

        {/* Register table */}
        <div className="mt-3 overflow-hidden rounded-2xl" style={{ background: c.panel, border: '1px solid ' + c.line }}>
          <div className="px-5 py-4 text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>
            Vendor register ({assessed.length}) — highest exposure first
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr style={{ color: c.sub, borderTop: '1px solid ' + c.line, borderBottom: '1px solid ' + c.line }}>
                  <th className="px-5 py-2.5 text-left font-medium">Vendor</th>
                  <th className="px-3 py-2.5 text-right font-medium">Criticality</th>
                  <th className="px-3 py-2.5 text-right font-medium">Inherent risk</th>
                  <th className="px-3 py-2.5 text-right font-medium">Exposure</th>
                  <th className="px-5 py-2.5 text-right font-medium">Tier</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((v) => (
                  <React.Fragment key={v.id}>
                    <tr onClick={() => setExpanded(expanded === v.id ? null : v.id)} className="cursor-pointer" style={{ borderBottom: '1px solid ' + c.line }}>
                      <td className="px-5 py-3">
                        <div className="font-semibold" style={{ color: c.ink }}>{v.name}</div>
                        <div className="text-xs" style={{ color: c.sub }}>{v.type}</div>
                      </td>
                      <td className="px-3 py-3 text-right" style={num}>{v.criticality}</td>
                      <td className="px-3 py-3 text-right" style={num}>{v.domainAvg}</td>
                      <td className="px-3 py-3 text-right font-semibold" style={{ ...num, color: tierColor(v.tier) }}>{v.exposure}</td>
                      <td className="px-5 py-3 text-right"><Chip tier={v.tier} /></td>
                    </tr>
                    {expanded === v.id && (
                      <tr style={{ borderBottom: '1px solid ' + c.line, background: c.bg }}>
                        <td colSpan={5} className="px-5 py-4">
                          <div className="grid grid-cols-1 gap-5 md:grid-cols-2">
                            <div>
                              <div className="text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>Risk domain profile</div>
                              <div className="mt-2 space-y-1.5">
                                {DOMAINS.map((d) => {
                                  const val = v[d.key];
                                  const col = val >= 70 ? c.crit : val >= 50 ? c.high : val >= 35 ? c.mod : c.low;
                                  return (
                                    <div key={d.key} className="flex items-center gap-2">
                                      <div className="w-40 text-xs" style={{ color: c.sub }}>{d.label}</div>
                                      <div className="h-2 flex-1 overflow-hidden rounded-full" style={{ background: c.line }}>
                                        <div className="h-full rounded-full" style={{ width: val + '%', background: col }} />
                                      </div>
                                      <div className="w-7 text-right text-xs" style={{ color: c.ink, ...num }}>{val}</div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                            <div>
                              <div className="text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>Assessment</div>
                              <div className="mt-1 text-sm" style={{ color: c.ink }}>{v.rationale}</div>
                              <div className="mt-2 text-xs font-semibold uppercase tracking-wider" style={{ color: c.sub }}>Required due diligence</div>
                              <div className="mt-1 rounded-lg px-3 py-2 text-sm" style={{ color: tierColor(v.tier), background: tierBg(v.tier), fontWeight: 500 }}>{v.action}</div>
                            </div>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <p className="mt-4 text-center text-xs" style={{ color: c.sub }}>
          Paste notes to auto-populate the risk domains, or set them manually. Click a vendor for its domain profile and required due diligence. Demo data shown.
        </p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ThirdPartyRiskAssessment));
</script>
</body>
</html>
